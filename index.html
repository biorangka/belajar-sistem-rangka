<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belajar Rangka 3D</title>
<style>
  body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: #1a1a2e; color: white; }
  .header { text-align: center; padding: 30px 20px; }
  .header h1 { font-size: 2em; margin: 0; }
  .header p { color: #aaa; margin-top: 5px; }
  
  .viewer-container {
    max-width: 900px;
    margin: 0 auto 30px auto;
    background: #16213e;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 2px solid #2a5298;
  }
  
  model-viewer {
    width: 100%;
    height: 600px;
    background: #0f0f1a;
    outline: none;
  }
</style>
<!-- Ini script wajib untuk membaca model 3D -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>

<div class="header">
  <h1>💀 Rangka Manusia 3D</h1>
  <p>Gunakan mouse atau jari untuk memutar dan melihat dari dekat</p>
</div>

<div class="viewer-container">
  <!-- Perhatikan bagian src. Itu adalah link ke file .glb gratis dari Google -->
  <model-viewer 
    src="https://modelviewer.dev/shared-assets/models/Skull.glb" 
    alt="Tengkorak Manusia"
    camera-controls 
    auto-rotate
    shadow-intensity="1"
    touch-action="pan-y">
  </model-viewer>
</div>

</body>
</html>
